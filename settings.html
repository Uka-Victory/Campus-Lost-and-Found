<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem("campusLostFoundTheme") || "auto";
      const resolvedTheme = savedTheme === "auto"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : savedTheme;
      document.documentElement.setAttribute("data-theme", resolvedTheme);
      document.documentElement.setAttribute("data-theme-mode", savedTheme);
    })();
  </script>
  <title>Settings - Campus Lost and Found Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="page-topbar">
      <div>
        <h1 class="page-title-left">Account Settings</h1>
        <p id="welcomeUser" class="subtitle left-subtitle">Manage your theme preferences and personal profile.</p>
      </div>

      <div class="profile-menu-wrap">
        <button type="button" id="profileMenuBtn" class="profile-menu-btn">☰ Profile</button>
        <div id="profileDropdown" class="profile-dropdown">
          <a href="./dashboard.html">Dashboard</a>
          <a href="./profile.html">Profile</a>
          <a href="./my-reports.html">My Reports</a>
          <a href="./support.html">Support</a>
          <a href="./settings.html">Settings</a>
          <a href="#" id="logoutBtn">Logout</a>
        </div>
      </div>
    </div>

    <div class="settings-layout">
      <div class="settings-panel">
        <span class="theme-chip">Theme Control</span>
        <h3>Appearance</h3>
        <p id="currentThemeLabel" class="helper-note">Current theme: Auto</p>
        <div class="theme-grid">
          <button type="button" id="themeLightBtn" class="theme-option">
            <span class="theme-option-title">☀️ Light</span>
            <span class="theme-option-text">Clean daylight view</span>
          </button>
          <button type="button" id="themeDarkBtn" class="theme-option">
            <span class="theme-option-title">🌙 Dark</span>
            <span class="theme-option-text">Midnight institutional</span>
          </button>
          <button type="button" id="themeAutoBtn" class="theme-option">
            <span class="theme-option-title">💻 Auto</span>
            <span class="theme-option-text">Match system OS</span>
          </button>
        </div>
      </div>

      <div class="form-panel">
        <span class="theme-chip">Profile &amp; Security</span>
        <h3>Update Account Details</h3>

        <form id="settingsForm">
          <label for="settingsFullName">Full Name</label>
          <input type="text" id="settingsFullName" placeholder="Full Name" required />

          <label for="settingsPhone">Phone Number</label>
          <input type="text" id="settingsPhone" placeholder="Phone Number" required />

          <label for="settingsEmail">Email Address</label>
          <input type="email" id="settingsEmail" placeholder="Email Address" required />

          <label for="settingsFaculty">Faculty</label>
          <input type="text" id="settingsFaculty" placeholder="Faculty" required />

          <label for="settingsDepartment">Department</label>
          <input type="text" id="settingsDepartment" placeholder="Department" required />

          <label for="settingsLevel">Current Level</label>
          <input type="text" id="settingsLevel" placeholder="Level" required />

          <label for="settingsPassport">Update Passport Photo (Optional)</label>
          <input type="file" id="settingsPassport" accept="image/*" />
          <img id="settingsPassportPreview" alt="Passport Preview" />

          <hr />
          <h4>Change Password (Optional)</h4>

          <label for="currentPassword">Current Password (Required to change Email or Password)</label>
          <input type="password" id="currentPassword" placeholder="Current Password" />

          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="New Password" />

          <label for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" placeholder="Confirm New Password" />

          <button type="submit">Save Changes</button>
        </form>
        <p id="message"></p>
      </div>
    </div>

    <div class="back-link-row">
      <a href="./dashboard.html">Back to Dashboard</a>
      <a href="./profile.html">View Profile</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
