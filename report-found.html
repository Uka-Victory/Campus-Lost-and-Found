<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem("campusLostFoundTheme") || "auto";
      const resolvedTheme = savedTheme === "auto"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : savedTheme;
      document.documentElement.setAttribute("data-theme", resolvedTheme);
      document.documentElement.setAttribute("data-theme-mode", savedTheme);
    })();
  </script>
  <title>Report Found Item - Campus Lost and Found Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="page-topbar">
      <div>
        <h1 class="page-title-left">Report Found Item</h1>
        <p id="welcomeUser" class="subtitle left-subtitle">State accurate details and where the item was deposited.</p>
      </div>

      <div class="profile-menu-wrap">
        <button type="button" id="profileMenuBtn" class="profile-menu-btn">☰ Profile</button>
        <div id="profileDropdown" class="profile-dropdown">
          <a href="./dashboard.html">Dashboard</a>
          <a href="./profile.html">Profile</a>
          <a href="./my-reports.html">My Reports</a>
          <a href="./support.html">Support</a>
          <a href="./settings.html">Settings</a>
          <a href="#" id="logoutBtn">Logout</a>
        </div>
      </div>
    </div>

    <div class="form-panel">
      <form id="foundItemForm">
        <label for="foundItemName">General Item Name</label>
        <input type="text" id="foundItemName" placeholder="Item Name (e.g. Black Samsung Phone, Brown Wallet)" required />

        <label for="foundCategory">Category</label>
        <select id="foundCategory" required>
          <option value="">Select Category</option>
          <option value="Electronics">Electronics</option>
          <option value="Books">Books</option>
          <option value="ID Card">ID Card</option>
          <option value="Keys">Keys</option>
          <option value="Bags">Bags</option>
          <option value="Clothes">Clothes</option>
          <option value="Others">Others</option>
        </select>

        <label for="foundDescription">General Description</label>
        <textarea id="foundDescription" placeholder="General public description (do not expose private verification secrets)" required></textarea>
  
        <label for="foundUniqueMarks">Confidential Unique Marks (Admin / Matching Only)</label>
        <textarea id="foundUniqueMarks" placeholder="Unique marks noticed: stickers, scratches, engravings, wallpaper, serial details"></textarea>

        <label for="dateFound">Date Found</label>
        <input type="date" id="dateFound" required />

        <label for="locationFound">Location Found</label>
        <input type="text" id="locationFound" placeholder="Location Found (e.g. Faculty Hallway, Cafeteria)" required />

        <label for="handInLocation">Custody / Hand-In Location</label>
        <input type="text" id="handInLocation" placeholder="Where was it handed in? (e.g. Security Post A, Dean's Office)" required />

        <label for="privateNote">Private Admin Verification Note</label>
        <textarea id="privateNote" placeholder="Private verification note (Admin-only confidential check)" required></textarea>

        <label for="foundImage">Upload Photo (Optional)</label>
        <input type="file" id="foundImage" accept="image/*" />
        <img id="foundImagePreview" alt="Found Item Preview" />

        <button type="submit">Submit Found Item Report</button>
      </form>

      <p id="message"></p>
    </div>

    <div class="back-link-row">
      <a href="./dashboard.html">Back to Dashboard</a>
      <a href="./browse-items.html">Browse Listings</a>
      <a href="./support.html">Support</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
