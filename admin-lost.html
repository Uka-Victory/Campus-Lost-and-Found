<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem("campusLostFoundTheme") || "auto";
      const resolvedTheme = savedTheme === "auto"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : savedTheme;
      document.documentElement.setAttribute("data-theme", resolvedTheme);
      document.documentElement.setAttribute("data-theme-mode", savedTheme);
    })();
  </script>
  <title>Admin Lost Reports - Campus Lost and Found Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="page-topbar">
      <div>
        <h1 class="page-title-left">Lost Reports</h1>
        <p id="welcomeUser" class="subtitle left-subtitle">Admin review page for lost-item reports.</p>
      </div>

      <div class="profile-menu-wrap">
        <button type="button" id="profileMenuBtn" class="profile-menu-btn">☰ Profile</button>
        <div id="profileDropdown" class="profile-dropdown">
          <a href="./admin.html">Admin Overview</a>
          <a href="./profile.html">Profile</a>
          <a href="./support.html">Support</a>
          <a href="./settings.html">Settings</a>
          <a href="#" id="logoutBtn">Logout</a>
        </div>
      </div>
    </div>

    <div class="items-box admin-section">
      <h2>Active Lost Reports</h2>
      <div id="adminLostItemsList"></div>
    </div>

    <details class="items-box admin-section archived-section">
      <summary><h2>Resolved Lost Reports <span style="float: right;">▼</span></h2></summary>
      <div id="adminResolvedLostItemsList" style="margin-top: 15px;"></div>
    </details>

    <div class="back-link-row">
      <a href="./admin.html">Back to Admin Dashboard</a>
      <a href="./support.html">Support</a>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
