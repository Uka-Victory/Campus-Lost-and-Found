<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem("campusLostFoundTheme") || "auto";
      const resolvedTheme = savedTheme === "auto"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : savedTheme;
      document.documentElement.setAttribute("data-theme", resolvedTheme);
      document.documentElement.setAttribute("data-theme-mode", savedTheme);
    })();
  </script>
  <title>Profile - Campus Lost and Found Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="page-topbar">
      <div>
        <h1 class="page-title-left">Profile</h1>
        <p class="subtitle left-subtitle">Your account information.</p>
      </div>

      <div class="profile-menu-wrap">
        <button type="button" id="profileMenuBtn" class="profile-menu-btn">☰ Profile</button>
        <div id="profileDropdown" class="profile-dropdown">
          <a href="./dashboard.html">Dashboard</a>
          <a href="./profile.html">Profile</a>
          <a href="./my-reports.html">My Reports</a>
          <a href="./support.html">Support</a>
          <a href="./settings.html">Settings</a>
          <a href="#" id="logoutBtn">Logout</a>
        </div>
      </div>
    </div>

    <div class="items-box">
      <h3 id="profileName">User</h3>
      <p><strong>Email:</strong> <span id="profileEmail">-</span></p>
      <p><strong>Phone:</strong> <span id="profilePhone">-</span></p>
      <p><strong>Faculty:</strong> <span id="profileFaculty">-</span></p>
      <p><strong>Department:</strong> <span id="profileDepartment">-</span></p>
      <p><strong>Level:</strong> <span id="profileLevel">-</span></p>
      <p><strong>Role:</strong> <span id="profileRole">-</span></p>
    </div>

    <div class="quick-links">
      <a href="./settings.html" class="quick-link">Edit Settings</a>
      <a href="./support.html" class="quick-link">Need Help?</a>
    </div>

    <div class="back-link-row">
      <a href="./dashboard.html">Back to Dashboard</a>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
